<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>找不到這個頁面 | 擎添工業 Ching-Tech</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="https://ching-tech.com/images/CTLogo.svg">
<link rel="stylesheet" href="https://ching-tech.github.io/brand/tokens.css">
<style>
  /* 這頁可能出現在任何層級的網址下，所以資源一律用絕對網址 */
  :root { --bg: #0e0e10; --text: #f0f0f0; --text-muted: #cfd0d4; --accent: #22d3ee; --border: #2a2b33; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--bg); color: var(--text);
    font: 400 1rem/1.75 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
  }
  main { width: min(100%, 34rem); }
  img { width: 56px; height: 56px; display: block; margin-bottom: 2rem; }
  .code { font: 500 .85rem/1 "JetBrains Mono", ui-monospace, monospace; letter-spacing: .1em; color: var(--accent); margin: 0 0 .8rem; }
  h1 { font-size: clamp(1.6rem, 6vw, 2.4rem); line-height: 1.3; margin: 0 0 1rem; }
  p { color: var(--text-muted); margin: 0 0 2rem; }
  .actions { display: flex; flex-wrap: wrap; gap: .8rem; }
  a.btn {
    display: inline-flex; align-items: center; min-height: 44px; padding: 0 1.4rem;
    border: 1px solid var(--border); border-radius: 99px; color: var(--text); text-decoration: none;
  }
  a.btn.solid { background: var(--accent); border-color: var(--accent); color: #0e0e10; font-weight: 700; }
  a.btn:hover { border-color: var(--accent); }
  a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="https://ching-tech.com/images/CTLogo.svg" alt="擎添工業">
  <p class="code">404</p>
  <h1>找不到這個頁面</h1>
  <p>網址可能打錯了，或這個頁面已經移除。回首頁可以看到擎添的服務與案例，也可以直接打電話給我們：(02) 2903-2788。</p>
  <div class="actions">
    <a class="btn solid" href="https://ching-tech.com/">回首頁</a>
    <a class="btn" href="https://ching-tech.com/#contact">聯絡我們</a>
  </div>
</main>
</body>
</html>
